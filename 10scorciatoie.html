<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ridurre le imposte Partita IVA - Guida informativa</title>
    <!-- Inclusione SDK EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            // Inserisci qui il tuo Public Key di EmailJS
            emailjs.init({
              publicKey: "Mh79Trdgb6PvKDwAs",
            });
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.4;
        }

        .container {
            max-width: 700px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 3.2rem;
            font-weight: 800;
            margin-bottom: 28px;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 1.5rem;
            margin-bottom: 40px;
            color: #222222;
        }

        .cta-button {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 20px 40px;
            font-size: 1.25rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .cta-button:hover {
            background-color: #333333;
        }

        /* Modal Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        /* Modal Content */
        .modal-content {
            background-color: #ffffff;
            color: #000000;
            padding: 40px;
            border-radius: 8px;
            max-width: 500px;
            width: 100%;
            text-align: left;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .close-btn {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 1.8rem;
            background: none;
            border: none;
            cursor: pointer;
            color: #000000;
        }

        .modal-content h3 {
            font-size: 1.8rem;
            margin-bottom: 24px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group input[type="email"] {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #000000;
            border-radius: 6px;
            font-size: 1.2rem;
            outline: none;
        }

        .form-group-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 28px;
            font-size: 1rem;
            color: #333333;
        }

        .form-group-checkbox input {
            margin-top: 4px;
            width: 18px;
            height: 18px;
            accent-color: #000000;
        }

        .submit-btn {
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #333333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>10 scorciatoie legali per ridurre le imposte di una partita iva</h1>
        <p>Scarica questa nuova guida informativa ora</p>
        <button class="cta-button" id="openModal">Scarica la guida</button>
    </div>

    <!-- Pop-up Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="close-btn" id="closeModal">&times;</button>
            <h3>Inserisci la tua email</h3>
            <form id="leadForm">
                <div class="form-group">
                    <input type="email" id="email" name="user_email" placeholder="Il tuo indirizzo email" required>
                </div>
                <div class="form-group-checkbox">
                    <input type="checkbox" id="gdpr" required>
                    <label for="gdpr">Acconsento al trattamento dei dati personali secondo la normativa GDPR e la privacy policy.</label>
                </div>
                <button type="submit" class="submit-btn">Scarica la guida ora</button>
            </form>
        </div>
    </div>

    <script>
        const modalOverlay = document.getElementById('modalOverlay');
        const openModalBtn = document.getElementById('openModal');
        const closeModalBtn = document.getElementById('closeModal');
        const leadForm = document.getElementById('leadForm');

        openModalBtn.addEventListener('click', () => {
            modalOverlay.style.display = 'flex';
        });

        closeModalBtn.addEventListener('click', () => {
            modalOverlay.style.display = 'none';
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.style.display = 'none';
            }
        });

        leadForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const gdprChecked = document.getElementById('gdpr').checked;

            if (email && gdprChecked) {
                // Configurazione EmailJS
                const serviceID = "service_b6i8u3a";
                const templateID = "template_duc1ojk";

                const templateParams = {
                    user_email: email,
                    message: "Nuovo contatto iscritto per scaricare la guida sulle 10 scorciatoie legali."
                };

                // Invio dell'email tramite EmailJS e successivo reindirizzamento
                emailjs.send(serviceID, templateID, templateParams)
                    .then((response) => {
                        console.log('SUCCESS!', response.status, response.text);
                        window.location.href = "scaricaguida.html";
                    }, (error) => {
                        console.log('FAILED...', error);
                        alert("Errore nell'invio del contatto. Riprova.");
                    });
            }
        });
    </script>

</body>
</html>
