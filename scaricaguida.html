<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guida Inviata - Partita IVA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            line-height: 1.5;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 24px;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 1.25rem;
            color: #333333;
            margin-bottom: 32px;
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">✉️</div>
        <h1>La guida è stata inviata via email!</h1>
        <p>Controlla la tua casella di posta (inclusa la cartella spam/promozioni) per trovare il link di download della guida informativa.</p>
    </div>

</body>
</html>
